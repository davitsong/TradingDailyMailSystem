name: Daily Stock Report Agent

on:
  schedule:
    - cron: '0 21 * * 2-6'  # 화~토요일 한국시간 아침 06:00 실행 (미국 월~금 장마감 보고서)
    - cron: '40 6 * * 1-5'  # 월~금요일 한국시간 오후 15:40 실행 (한국 월~금 장마감 보고서)
  workflow_dispatch:      # 깃허브 웹사이트에서 수동으로 테스트 실행 버튼 활성화

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4       # 🔴 v3에서 v4로 업데이트!

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5   # 🔴 v4에서 v5로 업데이트!
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: AI 에이전트 실행 및 이메일 발송
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python agent.py
