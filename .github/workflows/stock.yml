name: Daily Stock Report Agent

on:
  schedule:
    - cron: '57 20 * * 2-6'  # 1) 화~토요일 한국시간 아침 05:57 실행 (미국 월~금 장마감 보고서)
    - cron: '43 6 * * 1-5'   # 2) 월~금요일 한국시간 오후 15:43 실행 (한국 월~금 장마감 보고서)
  workflow_dispatch:      # 깃허브 웹사이트에서 수동으로 테스트 실행 버튼 활성화

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4       

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v5   
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: AI 에이전트 실행 및 이메일 발송
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 깃허브 환경 경고 완벽 방어
      run: python agent.py
