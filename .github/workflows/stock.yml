name: Daily Stock Report Agent

on:
  schedule:
    - cron: '0 21 * * *'  # 한국시간 매일 아침 06:00에 실행
    - cron: '40 6 * * *'  # 한국시간 매일 오후 15:40에 실행
  workflow_dispatch:      # 깃허브 웹사이트에서 수동으로 테스트 실행하고 싶을 때 쓰는 버튼 활성화

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: AI 에이전트 실행 및 이메일 발송
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python agent.py
